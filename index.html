<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernwerkstatt</title>
<meta name="theme-color" content="#1C7548">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: Trainingsplatz. Eine ruhige Spalte fürs Tablet, große Tippflächen, Text links und Aufgabe rechts beim Lesen. */
:root{
  --bg:#F2F7F3; --surface:#FFFFFF; --ink:#14291F; --muted:#54675C; --line:#D3DFD7;
  --pitch:#1C7548; --pitch-ink:#FFFFFF; --ball:#DDF04A; --ball-ink:#1D2A00;
  --sky:#2563C9; --tip-bg:#E8F0FD; --warn:#B4470F; --warn-bg:#FCEDE2; --good-bg:#E1F2E7; --mark:#FFF2A8;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1914; --surface:#17251E; --ink:#E7F0EA; --muted:#9CAFA4; --line:#2A3D33;
  --pitch:#49B983; --pitch-ink:#08170F; --ball:#DDF04A; --ball-ink:#1D2A00;
  --sky:#86B4FF; --tip-bg:#16263F; --warn:#F2996A; --warn-bg:#3A2215; --good-bg:#143224; --mark:#5A4E0E; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1914; --surface:#17251E; --ink:#E7F0EA; --muted:#9CAFA4; --line:#2A3D33;
  --pitch:#49B983; --pitch-ink:#08170F; --ball:#DDF04A; --ball-ink:#1D2A00;
  --sky:#86B4FF; --tip-bg:#16263F; --warn:#F2996A; --warn-bg:#3A2215; --good-bg:#143224; --mark:#5A4E0E; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.7rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center;font-family:var(--display);font-weight:600;font-size:1.15rem}
.dot{width:22px;height:22px;border-radius:50%;background:var(--ball);border:2px solid var(--ball-ink)}
.stars{font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
nav{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.tab{background:transparent;border:2px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:700;min-height:48px}
.tab[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{background:var(--pitch);color:var(--pitch-ink);border:0;border-radius:14px;padding:12px 22px;font-weight:800;min-height:52px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.tipb{background:var(--tip-bg);color:var(--sky);border:2px solid var(--sky)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)} .small{font-size:.9rem}
.label{font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.banner{background:var(--ball);color:var(--ball-ink);border-radius:16px;padding:14px 18px;font-weight:700;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.done{background:var(--good-bg);border-color:var(--pitch)}
.card .btn{margin-top:auto;align-self:flex-start}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:520px}
.tile{position:relative;border:2px solid var(--line);border-radius:12px;min-height:64px;overflow:hidden;background:var(--surface);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-weight:700;font-size:.85rem}
.tile i{position:absolute;left:0;right:0;bottom:0;background:var(--pitch);opacity:.28}
.tile.full{border-color:var(--pitch)} .tile.now{border-color:var(--ink)}
.tile span{position:relative}
.blank{visibility:hidden}
.work{display:grid;gap:18px;grid-template-columns:1fr}
.work.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:760px){.work.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.read{font-size:1.1rem;line-height:1.75}
.read mark{background:var(--mark);color:inherit;border-radius:4px;padding:1px 2px}
.q{font-size:1.25rem;font-weight:800;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:700;min-height:52px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink)}
.opt.no{opacity:.5;text-decoration:line-through}
.opt.yes{border-color:var(--pitch);background:var(--good-bg)}
.words{display:flex;flex-wrap:wrap;gap:8px}
.words .opt{padding:8px 14px}
.num{font:inherit;font-weight:800;font-size:1.3rem;width:9ch;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.tip{background:var(--tip-bg);border-left:0;border-radius:12px;padding:10px 14px}
.tip b{color:var(--sky)}
.msg{border-radius:12px;padding:12px 14px;font-weight:700}
.msg.bad{background:var(--warn-bg);color:var(--warn)} .msg.ok{background:var(--good-bg)}
.dots{display:flex;gap:6px}
.dots b{width:26px;height:8px;border-radius:4px;background:var(--line)} .dots b.on{background:var(--pitch)} .dots b.cur{background:var(--ink)}
.days{display:grid;gap:8px}
.day{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.day.today{border:2px solid var(--ink)} .day.exam{background:var(--ball);color:var(--ball-ink);border-color:var(--ball-ink)}
.day time{font-weight:800;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.note{border:2px dashed var(--line);border-radius:12px;padding:10px 14px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="dot" aria-hidden="true"></span>Lernwerkstatt</div>

    <button class="tab" data-act="nav" data-v="probe">Probe</button>
    <button class="tab" data-act="nav" data-v="eltern">Eltern</button>

  <main id="main" class="stack"></main>
  <p class="muted small">Der Lernstand bleibt nur auf diesem Gerät.</p>
</div>

    (cur.retry?'':'<div class="dots" aria-label="Aufgabe '+(cur.i+1)+' von '+b.tasks.length+'">'+b.tasks.map((x,k)=>'<b class="'+(k<cur.i?'on':k===cur.i?'cur':'')+'"></b>').join('')+'</div>')+'</div>'+
    '<button class="btn ghost" data-act="nav" data-v="'+(cur.retry?'heft':'heute')+'">Pause</button></div>';
  h+='<div class="work'+(b.text?' two':'')+'">';
  if(b.text){const ev=!open&&t.ev?t.ev:[];h+='<article class="panel stack"><h2>'+b.text.title+'</h2><p class="read">'+b.text.s.map((s,k)=>ev.includes(k)?'<mark>'+s+'</mark>':s).join(' ')+'</p>'+(ev.length?'<p class="muted small">Gelb markiert: die Stelle, an der die Antwort steht.</p>':'')+'</article>'}
  h+='<section class="panel stack">'+(cur.i===0&&!cur.retry&&open&&!cur.tries?'<p class="note small">'+b.info+'</p>':'')+'<p class="q">'+t.q+'</p>';
  if(t.type==='choice')h+='<div class="opts">'+cur.perm.map(k=>{const o=t.opts[k],yes=!open&&k===t.a,no=cur.wrong.includes(k);return '<button class="opt'+(yes?' yes':'')+(no?' no':'')+'" data-act="pick" data-k="'+k+'" aria-pressed="'+(cur.sel===k)+'"'+(!open||no?' disabled':'')+'>'+o+'</button>'}).join('')+'</div>';
  if(t.type==='words')h+='<div class="words">'+t.words.map((w,k)=>{const on=(cur.sel||[]).includes(k),yes=!open&&t.a.includes(k);return '<button class="opt'+(yes?' yes':'')+'" data-act="word" data-k="'+k+'" aria-pressed="'+on+'"'+(open?'':' disabled')+'>'+w+'</button>'}).join('')+'</div>';
  if(t.type==='order')h+='<div class="opts">'+t.words.map((w,k)=>{const pos=open?(cur.sel||[]).indexOf(k):t.a.indexOf(k);return '<button class="opt'+(open?'':' yes')+'" data-act="word" data-k="'+k+'" aria-pressed="'+(open&&pos>=0)+'"'+(open?'':' disabled')+'>'+(pos>=0?'<b>'+(pos+1)+'.</b> ':'')+w+'</button>'}).join('')+'</div>';
  if(t.type==='number')h+='<div class="row"><label for="num-'+t.id+'" class="label">Dein Ergebnis</label><input class="num" id="num-'+t.id+'" inputmode="numeric" autocomplete="off" value="'+(cur.sel||'')+'"'+(open?'':' disabled')+'><b>'+t.unit+'</b></div>';
  for(let k=0;k<cur.tips;k++)h+='<p class="tip"><b>Tipp '+(k+1)+':</b> '+t.tips[k]+'</p>';
  if(cur.msg)h+='<p class="msg '+(cur.status==='right'?'ok':'bad')+'" role="status">'+cur.msg+'</p>';
  if(t.type==='recall')h+=recallUI(t,open);
  else if(open){
    h+='<div class="stack" style="gap:8px"><span class="label">Antwort abgeben: Wie sicher bist du?</span><div class="row" id="confrow">'+Object.keys(CONF).map(c=>'<button class="btn" data-act="conf" data-c="'+c+'"'+(has?'':' disabled')+'>'+CONF[c][0].toUpperCase()+CONF[c].slice(1)+'</button>').join('')+'</div></div>';
    h+='<div class="row">'+(cur.tips<3?'<button class="btn tipb" data-act="tip">Tipp holen ('+(cur.tips+1)+' von 3)</button>':'')+((cur.tries>=2||cur.tips>=3)?'<button class="btn ghost" data-act="show">Lösung zeigen</button>':'')+'</div>';
  }else{
    h+='<p><b>'+(cur.status==='right'?'So ist es: ':'Die Lösung: ')+'</b>'+t.explain+'</p>'+(cur.status==='shown'?'<p class="muted small">Diese Aufgabe kommt ins Fehlerheft. Dort übst du sie noch einmal.</p>':'')+
      '<div class="row"><button class="btn" data-act="next">'+(cur.retry?'Zurück zum Fehlerheft':'Weiter')+'</button></div>';
  }
  return h+'</section></div>';
}

function vHeft(){
  let h='<div class="stack"><h1>Fehlerheft</h1><p class="muted">Hier landet, was noch nicht sofort geklappt hat. Fehler sind Trainingsstoff. Was du hier löst, verschwindet.</p></div>';
  if(!S.heft.length)return h+'<section class="panel"><p>Dein Fehlerheft ist leer. Aufgaben erscheinen hier, sobald eine beim ersten Versuch nicht klappt.</p></section>';
  return h+'<div class="stack">'+S.heft.map(id=>{const x=T[id];return '<section class="card"><span class="label">'+x.t.thema+'</span><p>'+x.t.q+'</p><button class="btn" data-act="retry" data-id="'+id+'">Nochmal üben</button></section>'}).join('')+'</div>';
}

function vProbe(){
  const plan=[['Di 10.11.','Genau lesen und Angaben verbinden','10'],['Mi 11.11.','Zwischen den Zeilen lesen: Gefühle und Gründe','11'],['Do 12.11.','Fragen genau nehmen: Wer? Was? Wann?','12'],['Fr 13.11.','Frei (Joker-Tag)','13'],['Sa 14.11.','Sachtext lesen und Stellen markieren','14'],['So 15.11.','Frei (Joker-Tag)','15'],['Mo 16.11.','Übungsprobe auf Papier, danach gemeinsam durchsehen','16'],['Di 17.11.','Nur Fehlerheft, dann Schluss','17'],['Mi 18.11.','Leseprobe in der Schule','18']];
  const n=new Date(),td=(n.getFullYear()===2026&&n.getMonth()===10)?String(n.getDate()):'';
  return '<div class="stack"><h1>Proben-Trainer</h1><p class="muted">'+examLine()+'. So ist der Stoff auf die Tage verteilt.</p></div><div class="days">'+
    plan.map(p=>'<div class="day'+(p[2]===td?' today':'')+(p[2]==='18'?' exam':'')+'"><time>'+p[0]+'</time><span>'+p[1]+(p[2]===td?' <b>(heute)</b>':'')+'</span></div>').join('')+'</div>'+
    '<section class="panel stack"><h3>Drei Schritte für jede Lesefrage</h3><ol style="margin:0;padding-left:1.2em" class="stack"><li>Frage zweimal lesen und das Fragewort unterstreichen.</li><li>Die Stelle im Text suchen und markieren.</li><li>Antwort mit der Stelle vergleichen: Passt jedes Wort?</li></ol></section>';
}

function report(){
  const rs=ids().filter(id=>S.done[id]).map(id=>[id,S.done[id]]),n=rs.length,hf=S.heft.filter(id=>ids().includes(id));if(!n)return 'Heute wurde noch keine Aufgabe bearbeitet.';
  const self=rs.filter(([,r])=>r.solved==='self').length,first=rs.filter(([,r])=>r.solved==='self'&&r.tries===1).length,tips=rs.reduce((a,[,r])=>a+r.tips,0);
  const over=rs.filter(([,r])=>r.conf==='s'&&(r.tries>1||r.solved!=='self')).length;
  let s='Heute wurden '+n+' von '+TOTAL+' Aufgaben bearbeitet und '+self+' davon selbst gelöst, '+first+' im ersten Versuch. Dabei wurden '+tips+(tips===1?' Tipp':' Tipps')+' genutzt.';
  if(over)s+=' Bei '+over+(over===1?' Aufgabe':' Aufgaben')+' war er sich sicher und lag zunächst daneben. Das spricht für zu schnelles Lesen der Angabe.';
  s+=hf.length?' Noch üben: '+[...new Set(hf.map(id=>T[id].t.thema))].join('; ')+'.':' Im Fehlerheft ist nichts offen.';
  const rc=rs.filter(([id])=>T[id].t.type==='recall');if(rc.length)s+=' Beim Aufschreiben ohne Auswahl waren '+rc.filter(([,x])=>x.solved==='self').length+' von '+rc.length+' Aufgaben vollständig.';
  const lt=rs.filter(([,x])=>x.solved==='late').length;if(lt)s+=' '+lt+(lt===1?' Aufgabe wurde':' Aufgaben wurden')+' erst nach mehr als zwei Versuchen richtig und '+(lt===1?'zählt':'zählen')+' nicht als gelöst.';
  s+=' Heute zur Wiederholung fällig: '+dueIds().length+'.';
  if(feel())s+=' Seine eigene Einschätzung der Einheit: '+feel()+'.';
  return s;
}
function vEltern(){
  if(!pinOk)return '<div class="stack"><h1>Elternbereich</h1><p class="muted">Bitte PIN eingeben. Im Prototyp lautet sie 1234.</p></div><section class="panel stack"><div class="row"><label for="pin" class="label">PIN</label><input class="num" id="pin" inputmode="numeric" maxlength="4" autocomplete="off"><button class="btn" data-act="pin">Öffnen</button></div>'+(pinMsg?'<p class="msg bad" role="status">'+pinMsg+'</p>':'')+'</section>';
  let h='<div class="stack"><h1>Elternbereich</h1></div><section class="panel stack"><span class="label">Kurzbericht von heute · '+SETS[S.set].name+'</span><p>'+report()+'</p></section>';
  h+='<section class="panel stack"><span class="label">Abdeckung des Stoffs</span><div class="scroll"><table><thead><tr><th>Block</th><th>Hefteintrag</th><th>Aufgaben</th><th>Bearbeitet</th><th>Selbst gelöst</th></tr></thead><tbody>'+BLOCKS.map(b=>{const d=b.tasks.filter(t=>S.done[t.id]);return '<tr><td>'+b.title+'</td><td>'+(b.src||'–')+'</td><td>'+b.tasks.length+'</td><td>'+d.length+'</td><td>'+d.filter(t=>S.done[t.id].solved==='self').length+'</td></tr>'}).join('')+'</tbody></table></div></section>';
  h+='<section class="panel stack"><span class="label">Aufgaben im Detail</span><div class="scroll"><table><thead><tr><th>Thema</th><th>Versuche</th><th>Tipps</th><th>Einschätzung</th><th>Ergebnis</th><th>Wiederholung</th></tr></thead><tbody>'+
    ids().map(id=>{const r=S.done[id];return '<tr><td>'+T[id].t.thema+'</td>'+(r?'<td>'+r.tries+'</td><td>'+r.tips+'</td><td>'+(r.conf?CONF[r.conf]:'–')+'</td><td>'+(r.solved==='self'?(r.need?r.got+' von '+T[id].t.items.length+' aufgeschrieben':'selbst gelöst'):r.solved==='late'?'erst nach '+r.tries+' Versuchen':r.solved==='miss'?r.got+' aufgeschrieben, '+r.need+' gebraucht':'Lösung gezeigt')+'</td><td>'+(S.rev&&S.rev[id]?(S.rev[id].due<=today()?'heute':'in '+(S.rev[id].due-today())+(S.rev[id].due-today()===1?' Tag':' Tagen')):'–')+'</td>':'<td colspan="5" class="muted">noch offen</td>')+'</tr>'}).join('')+'</tbody></table></div></section>';
  h+='<section class="panel stack"><span class="label">Einstellungen (im Prototyp nur Anzeige)</span><p>Zeitlimit je Einheit: 20 Minuten · Nächste Probe: Leseprobe am 18.11. · Themen aus dem Alltag: Fußball, Pokémon, Reisen, Skifahren, Tennis</p><div class="row"><button class="btn ghost" data-act="reset">Lernstand zurücksetzen</button></div></section>';
  return h;
}

function render(){
  document.querySelectorAll('.tab').forEach(t=>t.dataset.v===view?t.setAttribute('aria-current','page'):t.removeAttribute('aria-current'));
  document.getElementById('stars').textContent='★ '+selfCount()+' von '+TOTAL;
  main.innerHTML=({heute:vHeute,ueben:vUeben,heft:vHeft,probe:vProbe,eltern:vEltern})[view]();
}
function addHeft(id){if(!S.heft.includes(id))S.heft.push(id)}
const INT=[1,3,7,21];
function today(){const n=new Date();return Math.round(new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime()/864e5)}
function sched(id){const x=T[id];return !SETS[x.set].blocks[x.bi].text}
function dueIds(){const d=today();return ids().filter(id=>S.rev&&S.rev[id]&&S.rev[id].due<=d&&!S.heft.includes(id)).sort((a,b)=>S.rev[a].due-S.rev[b].due)}
function record(t,solved,extra){
  const ql=solved==='self'?(cur.tries===1&&cur.tips===0?2:1):0;
  if(!cur.retry&&!cur.blk)S.done[t.id]=Object.assign({tries:cur.tries,tips:cur.tips,conf:cur.conf,solved},extra||{});
  if(ql===0)addHeft(t.id);else if(cur.retry||cur.blk)S.heft=S.heft.filter(x=>x!==t.id);
  if(sched(t.id)){S.rev=S.rev||{};const r=S.rev[t.id]||{box:0};if(ql===2){r.due=today()+INT[r.box];r.box=Math.min(r.box+1,INT.length-1)}else{r.box=0;r.due=today()+(ql?1:0)}S.rev[t.id]=r}
  if(cur.res)cur.res.push(ql);
}
function selfcheck(){
  const t=(cur.blk||BLOCKS[cur.b]).tasks[cur.i],got=(cur.sel||[]).length,ok=got>=t.need;
  cur.tries=1;cur.status=ok?'right':'shown';
  cur.msg=ok?'Du hast '+got+' von '+t.items.length+' aufgeschrieben. '+t.lob:'Du hattest '+got+', gebraucht werden '+t.need+'. Schau dir an, was gefehlt hat.';
  record(t,ok?'self':'miss',{got,need:t.need});save();
}
function recallUI(t,open){
  const next='<div class="row"><button class="btn" data-act="next">'+(cur.retry?'Zurück zum Fehlerheft':'Weiter')+'</button></div>';
  if(open&&!cur.revealed)return '<p class="note">Schreibe die Antwort in dein Heft.'+(t.need<t.items.length?' Du brauchst '+t.need+'.':'')+' Tippe erst danach weiter.</p><div class="row">'+(cur.tips<3?'<button class="btn tipb" data-act="tip">Tipp holen ('+(cur.tips+1)+' von 3)</button>':'')+'<button class="btn" data-act="reveal">Ich habe es aufgeschrieben</button></div>';
  let h='<span class="label">'+(open?'Vergleiche mit deinem Heft. Tippe alles an, was du aufgeschrieben hast.':'Die Lösung')+'</span><div class="opts">'+t.items.map((w,k)=>{const on=(cur.sel||[]).includes(k);return '<button class="opt'+(on?' yes':'')+'" data-act="word" data-k="'+k+'" aria-pressed="'+on+'"'+(open?'':' disabled')+'>'+w+'</button>'}).join('')+'</div>';
  if(open)return h+'<p class="muted small">Sei ehrlich zu dir. Nur so weißt du, was du noch üben musst.</p><div class="row"><button class="btn" data-act="selfcheck">Fertig verglichen</button></div>';
  return h+(cur.status==='right'?'':'<p class="muted small">Diese Aufgabe kommt ins Fehlerheft. Dort übst du sie noch einmal.</p>')+next;
}
function check(c){
  const b=(cur.blk||BLOCKS[cur.b]),t=b.tasks[cur.i];let ok;
  if(t.type==='choice')ok=cur.sel===t.a;
  else if(t.type==='words')ok=[...cur.sel].sort((x,y)=>x-y).join()===t.a.join();
  else if(t.type==='order')ok=cur.sel.join()===t.a.join();
  else ok=Number(String(cur.sel).replace(/[^0-9]/g,''))===t.a;
  if(!cur.conf)cur.conf=c;
  cur.tries++;
  if(ok){
    const late=cur.tries>2;
    cur.status='right';cur.msg=late?'Jetzt stimmt es. Du hast dafür viele Versuche gebraucht. Deshalb üben wir die Aufgabe noch einmal.':(cur.tries===1?'Richtig, gleich beim ersten Mal. ':'Jetzt stimmt es. Dranbleiben lohnt sich. ')+t.lob;
    record(t,late?'late':'self');
  }else{
    if(t.type==='choice'){cur.wrong.push(cur.sel);cur.sel=null}
    cur.msg=['Noch nicht. Lies die Aufgabe noch einmal ganz langsam.','Fast. Schau genau hin: Was ist wirklich gefragt?','Das passt noch nicht. Ein Tipp kann dir jetzt helfen.'][Math.min(cur.tries-1,2)];
    addHeft(t.id);
  }
  save();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='nav'){view=el.dataset.v;cur=null;if(view!=='eltern'){pinOk=false;pinMsg=''}}
  else if(a==='start'){const b=+el.dataset.b;let i=BLOCKS[b].tasks.findIndex(t=>!S.done[t.id]);if(i<0)i=0;cur=Object.assign({b,i},fresh());view='ueben'}
  else if(a==='set'){useSet(el.dataset.s);save()}
  else if(a==='retry'){const x=T[el.dataset.id];useSet(x.set);cur=Object.assign({b:x.bi,i:x.ti,retry:true},fresh());view='ueben'}
  else if(a==='review'){const l=dueIds().slice(0,5).map(id=>T[id].t);if(l.length){cur=Object.assign({b:0,i:0,blk:{id:'rev',title:'Wiederholen',info:'Diese Aufgaben kennst du schon. Mal sehen, was noch im Kopf ist.',tasks:l},res:[]},fresh());view='ueben'}}
  else if(a==='reveal'){cur.revealed=true;cur.sel=[]}
  else if(a==='selfcheck'){selfcheck()}
  else if(a==='pick'){cur.sel=+el.dataset.k}
  else if(a==='word'){const k=+el.dataset.k;cur.sel=cur.sel||[];cur.sel=cur.sel.includes(k)?cur.sel.filter(x=>x!==k):cur.sel.concat(k)}
  else if(a==='tip'){cur.tips++}
  else if(a==='conf'){check(el.dataset.c)}
  else if(a==='show'){const t=(cur.blk||BLOCKS[cur.b]).tasks[cur.i];cur.status='shown';cur.msg='';record(t,'shown');save()}
  else if(a==='next'){
    if(cur.retry){view='heft';cur=null}
    else{const b=(cur.blk||BLOCKS[cur.b]);if(cur.i+1<b.tasks.length){cur=Object.assign({b:cur.b,i:cur.i+1,blk:cur.blk,res:cur.res},fresh())}else{if(!cur.blk&&!S.blocks.includes(b.id))S.blocks.push(b.id);save();cur.status='blockdone'}}
  }
  else if(a==='feel'){S.feels=S.feels||{};S.feels[S.set]=el.dataset.f;save()}
  else if(a==='pin'){const v=document.getElementById('pin').value;if(v==='1234'){pinOk=true;pinMsg=''}else{pinMsg='Die PIN stimmt nicht. Im Prototyp lautet sie 1234.'}}
  else if(a==='reset'){S={done:{},blocks:[],heft:[],feels:{},set:S.set};save()}
  render();
  if(a==='next'||a==='start'||a==='retry'||a==='nav'||a==='review')window.scrollTo(0,0);
});
document.addEventListener('input',e=>{
  if(cur&&e.target.id&&e.target.id.indexOf('num-')===0){cur.sel=e.target.value.trim();document.querySelectorAll('#confrow button').forEach(b=>b.disabled=!cur.sel)}
});
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
